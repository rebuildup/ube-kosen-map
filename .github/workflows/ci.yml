name: ci

on:
  push:
    branches: [main, "release-*"]
  pull_request:
  # pull_request_target runs this workflow definition from the BASE
  # revision, so the contract job below cannot be weakened or removed by
  # the candidate. The candidate tree is only read as data, never executed.
  pull_request_target:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Candidate code must never run under the write-scoped
    # pull_request_target token; check stays on the pull_request event.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.1"

      - run: bun install --frozen-lockfile

      - run: bun run validate:integration

  contract:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # trusted = base revision (default for pull_request_target)
          ref: ${{ github.base_ref }}
          path: trusted

      - uses: actions/checkout@v4
        with:
          # candidate = exact PR head, read as data only
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Verify quality contract against base revision
        id: verify
        run: |
          if [ ! -f trusted/quality-contract.json ]; then
            echo "quality-contract.json is not present on the base revision; skipping."
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f trusted/.agents/skills/system-quality/scripts/verify-contract.mts ]; then
            echo "verify-contract.mts is not present on the base revision; skipping."
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Run the checker from the trusted (base) revision so a candidate
          # cannot weaken the verifier and self-approve.
          set +e
          node trusted/.agents/skills/system-quality/scripts/verify-contract.mts trusted candidate > contract-result.json
          code=$?
          set -e
          cat contract-result.json
          status=$(grep -o '"status":"[^"]*"' contract-result.json | cut -d'"' -f4 || true)
          if [ -z "$status" ]; then
            echo "verifier did not produce a result (exit $code)"
            exit "$code"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "CONTRACT_CHANGED" ]; then
            changed=$(grep -o '"changed":\[[^]]*\]' contract-result.json || true)
            echo "### Contract change detected" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            echo "$changed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Require owner approval for contract changes
        if: steps.verify.outputs.status == 'CONTRACT_CHANGED'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A contract change is legitimate only with an explicit approval
          # bound to the exact head SHA under review. The PR author cannot
          # approve their own PR, so this cannot be self-authorized.
          approved=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" \
            --jq "[.[] | select(.state == \"APPROVED\" and .commit_id == \"$HEAD_SHA\" and (.author_association == \"OWNER\" or .author_association == \"MEMBER\" or .author_association == \"COLLABORATOR\"))] | last | .user.login" \
            || true)
          if [ -z "$approved" ] || [ "$approved" = "null" ]; then
            echo "CONTRACT_CHANGED requires an approving review on commit $HEAD_SHA"
            echo "by a repository owner/member/collaborator."
            echo "Review the changed paths above, then approve this PR on GitHub"
            echo "and re-run this check."
            exit 1
          fi
          echo "Contract change approved by $approved on $HEAD_SHA"

  # Comprehensive release validation runs only at freeze time: on the
  # release PR targeting main, or on demand via workflow_dispatch against a
  # chosen ref. Ordinary pushes to release-* run the `check` job only.
  release-gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.1"

      - run: bun install --frozen-lockfile

      - run: bun run validate:release
